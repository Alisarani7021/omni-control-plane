name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Lint (parse · no-CDN · no-secrets)
        run: npm run lint

      - name: Unit + contract tests
        run: npm test

      - name: Asset budget
        run: npm run build

      - name: Worker dry-run deploy
        run: npx wrangler deploy --dry-run --outdir .tmp/dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
