# Auto-deploy the control plane when main changes. No credential ever touches chat:
# the four secrets are set ONCE in the GitHub repo UI
# (Settings → Secrets and variables → Actions) and only read by this workflow:
#   CLOUDFLARE_API_TOKEN    — scoped token for THIS worker only:
#       Account: Workers Scripts Edit, D1 Edit; Zone: Workers Routes Edit, Zone Read
#   CLOUDFLARE_ACCOUNT_ID   — from the CF dashboard sidebar (not secret, but handy)
#   TELEGRAM_BOT_TOKEN      — bot token from @BotFather
#   TELEGRAM_WEBHOOK_SECRET — any random string; must match the Worker secret
# If the secrets are absent the job is skipped and CI stays green.
name: v13-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `secrets` is not an allowed context in a job-level `if` (Actions rejects
    # the whole file with "Unrecognized named-value: 'secrets'"), so the gate is
    # a first step that reports whether the credential exists.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - name: Check deployment credentials
        id: gate
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set in this repository."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Apply D1 migrations (non-interactive skips the confirm prompt)
        if: steps.gate.outputs.ready == 'true'
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler d1 migrations apply v13-control-plane --remote

      - name: Deploy worker
        if: steps.gate.outputs.ready == 'true'
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy

      - name: Register Telegram webhook + commands
        if: steps.gate.outputs.ready == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        env:
          PUBLIC_BASE_URL: https://control.nnguts.dpdns.org
        run: node scripts/set-telegram-webhook.mjs
